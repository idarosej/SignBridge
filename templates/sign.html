<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Detection | SignBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>

        <h2>🤟 SignBridge</h2>

    </nav>


    <!-- =========================
         MAIN SECTION
    ========================== -->

    <section class="hero">

        <div class="dashboard">


            <!-- =========================
                 CAMERA CARD
            ========================== -->

            <div class="camera-card">

                <h2>📷 Live Camera</h2>

                <img src="{{ url_for('video') }}"
                     width="700"
                     class="camera">

                <p class="camera-status">
                    🟢 Camera Active
                </p>

            </div>


            <!-- =========================
                 INFORMATION CARD
            ========================== -->

            <div class="info-card">


                <!-- CURRENT GESTURE -->

                <h2>🤟 Current Gesture</h2>

                <div class="gesture-display">

                    <h1 id="gestureText">
                        No Hand Detected
                    </h1>

                </div>


                <hr>


                <!-- CONFIDENCE -->

                <h3>📊 AI Confidence</h3>

                <div class="progress">

                    <div id="confidenceBar"
                         class="progress-fill">

                    </div>

                </div>

                <p id="confidenceText">
                    0%
                </p>


                <hr>


                <!-- RECENT GESTURES -->

                <h3>📝 Recent Gestures</h3>

                <div class="history-container">

                    <ul id="historyList">

                    </ul>

                </div>


                <hr>


                <!-- SESSION STATISTICS -->

                <h3>📈 Session Statistics</h3>

                <div class="stats-grid">


                    <!-- TOTAL GESTURES -->

                    <div class="stat-card">

                        <span class="stat-title">
                            Total Gestures
                        </span>

                        <strong id="totalGestures">
                            0
                        </strong>

                    </div>


                    <!-- MOST DETECTED -->

                    <div class="stat-card">

                        <span class="stat-title">
                            Most Detected
                        </span>

                        <strong id="mostDetected">
                            None
                        </strong>

                    </div>


                    <!-- BEST CONFIDENCE -->

                    <div class="stat-card">

                        <span class="stat-title">
                            Best Confidence
                        </span>

                        <strong id="bestConfidence">
                            0%
                        </strong>

                    </div>

                </div>


                <br>


                <!-- BACK BUTTON -->

               
                <button class="btn secondary" onclick="resetSession()">
                     🔄 Reset Session
                </button> 
                
                <a href="/">
                    <button class="btn">
                        ⬅ Back Home
                    </button>

                </a>

            </div>

        </div>

    </section>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
